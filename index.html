<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Developers Project Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
      --bg: #0F172A;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }

    /* Ambient background glow */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
    }
    .glow-blue {
      width: 400px;
      height: 400px;
      background: var(--google-blue);
      top: -100px;
      left: -100px;
    }
    .glow-green {
      width: 350px;
      height: 350px;
      background: var(--google-green);
      bottom: -80px;
      right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .google-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-blue { background: var(--google-blue); }
    .dot-red { background: var(--google-red); }
    .dot-yellow { background: var(--google-yellow); }
    .dot-green { background: var(--google-green); }

    h1 {
      font-family: 'Google Sans', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.lead {
      color: var(--text-muted);
      font-size: 1.15rem;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 32px;
      text-align: left;
    }

    .status-info h4 {
      font-size: 1rem;
      color: #F1F5F9;
      margin-bottom: 4px;
    }
    .status-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge-live {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--google-green);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .pulsing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--google-green);
      box-shadow: 0 0 10px var(--google-green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--google-blue);
      color: #fff;
      border: none;
      box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
    }
    .btn-primary:hover {
      background: #3367d6;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(66, 133, 244, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #F8FAFC;
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="glow glow-blue"></div>
  <div class="glow glow-green"></div>

  <div class="container">
    <div class="logo-badge">
      <div class="google-dots">
        <span class="dot dot-blue"></span>
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <span>Google Developers Project</span>
    </div>

    <h1>Ready to Build & Deploy</h1>
    <p class="lead">
      Repository connected and deployment workflow active. Everything is set up for the 10:00 AM bootcamp kick-off!
    </p>

    <div class="status-card">
      <div class="status-info">
        <h4>Deployment Status</h4>
        <p>Connected to GitHub: <strong>Bahvyait/google-dev-project</strong></p>
      </div>
      <div class="badge-live">
        <span class="pulsing-dot"></span>
        Live & Ready
      </div>
    </div>

    <div class="actions">
      <a href="https://github.com/Bahvyait/google-dev-project" target="_blank" class="btn btn-primary">
        View on GitHub
      </a>
      <button class="btn btn-secondary" onclick="alert('Ready for bootcamp prompt at 10 AM!')">
        Test Interactive Action
      </button>
    </div>
  </div>
</body>
</html>
